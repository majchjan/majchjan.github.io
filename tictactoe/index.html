<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Majchrowicz - KÓŁKO I KRZYŻYK</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/main/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/main/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/main/icon/favicon-16x16.png">
    <link rel="manifest" href="/main/icon/site.webmanifest">

</head>
<body>
    <script type="module" src="js/code.js"></script>
    <header class="logo">
        <a href=".">KÓŁKO I KRZYŻYK</a>
    </header>
    <section>

        <div class="input-container">

            <!-- Ekran 1: lobby -->
            <div class="screen lobby-screen active">
                <div class="textinfo">Nowa gra:</div>
                <button class="start-btn" onclick="createRoom()">Stwórz stół</button>
                <div class="textinfo">Albo dołącz do istniejącego:</div>
                <div class="input-row">
                    <input type="text" class="code-input" maxlength="5" placeholder="KOD" autocomplete="off" spellcheck="false">
                    <button class="join-btn" onclick="joinFromInput()">Dołącz</button>
                </div>
                <div class="loader"></div>
                <div class="noteshower lobby-note"></div>
            </div>

            <!-- Ekran 2: oczekiwanie na przeciwnika -->
            <div class="screen waiting-screen">
                <div class="textinfo">Podaj ten kod drugiemu graczowi:</div>
                <div class="codeshower" onclick="copyCode()">-----</div>
                <div class="noteshower waiting-note">Czekam na przeciwnika...</div>
                <button class="endroundbutton" onclick="copyCode()">Kopiuj kod</button>
                <button class="nextbutton" onclick="leaveRoom()">Anuluj</button>
            </div>

            <!-- Ekran 3: plansza -->
            <div class="screen game-screen">
                <div class="statusbar">
                    <div class="turnshower">...</div>
                    <div class="seatshower"></div>
                </div>
                <div class="board"></div>
                <div class="resultshower"></div>
                <button class="start-btn rematch-btn" onclick="rematch()">Rewanż</button>
                <button class="nextbutton" onclick="leaveRoom()">Wyjdź</button>
            </div>

        </div>
    </section>
    <footer>
        <div class="footer">
            <a target="_blank" href="./rules.html">Zasady gry</a> | 
            &copy; 2025 - <a target="_blank" style="color: white; text-decoration: none"
                             href="https://github.com/majchjan">
            GitHub/majchjan</a>
        </div>
    </footer>
</body>
</html>
