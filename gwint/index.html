<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Majchrowicz - GWINT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/main/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/main/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/main/icon/favicon-16x16.png">
    <link rel="manifest" href="/main/icon/site.webmanifest">
    <script type="module" src="js/ui.js"></script>
</head>
<body>
    <button class="fullscreen-btn" title="Tryb pełnoekranowy">⛶</button>
    <header class="logo">
        <a href=".">GWINT</a>
    </header>
    <section>
        <div class="stage">

            <!-- ============ EKRAN 1: LOBBY ============ -->
            <div class="screen lobby-screen active">
                <div class="textinfo">Nowy stół:</div>
                <button class="start-btn create-btn">Stwórz stół</button>
                <div class="textinfo">Albo dołącz do istniejącego:</div>
                <div class="input-row">
                    <input type="text" class="code-input" maxlength="5" placeholder="KOD" autocomplete="off" spellcheck="false">
                    <button class="join-btn">Dołącz</button>
                </div>
                <div class="textinfo">Talie:</div>
                <button class="editor-btn">Edytor talii</button>
                <div class="loader"></div>
                <div class="noteshower lobby-note"></div>
            </div>

            <!-- ============ EKRAN 2: WYBÓR FRAKCJI ============ -->
            <div class="screen setup-screen">
                <div class="textinfo">Kod stołu:</div>
                <div class="codeshower" title="Kliknij, aby skopiować">-----</div>
                <div class="textinfo">Twoja talia:</div>
                <div class="input-row">
                    <select class="deck-select grow"></select>
                    <button class="editor-btn">Edytor talii</button>
                </div>
                <div class="leader-info"></div>
                <button class="start-btn ready-btn">Gotowy</button>
                <button class="nextbutton leave-btn">Opuść stół</button>
                <div class="noteshower setup-note"></div>
            </div>

            <!-- ============ EKRAN 3: MULLIGAN ============ -->
            <div class="screen mulligan-screen">
                <div class="textinfo mulligan-info">Wymień do 2 kart</div>
                <div class="hand mulligan-hand"></div>
                <button class="start-btn mulligan-done-btn">Zakończ wymianę</button>
                <div class="noteshower mulligan-note"></div>
            </div>

            <!-- ============ EKRAN 4: GRA ============ -->
            <div class="screen game-screen">

                <div class="table">

                    <div class="sidebar">
                        <div class="playergroup">
                            <div class="leaderbox leader-top"></div>
                            <div class="playerbox player-top">
                            <div class="playerfaction">—</div>
                            <div class="playerline">
                                <div class="lives"></div>
                                <div class="handcount">0</div>
                            </div>
                            <div class="total">0</div>
                            <div class="playerstate"></div>
                            </div>
                        </div>

                        <div class="weatherfield">
                            <div class="weathercards"></div>
                        </div>

                        <div class="playergroup">
                            <div class="playerbox player-bottom">
                                <div class="playerfaction">—</div>
                                <div class="playerline">
                                    <div class="lives"></div>
                                    <div class="handcount">0</div>
                                </div>
                                <div class="total">0</div>
                                <button class="nextbutton pass-btn">Pas</button>
                                <div class="playerstate"></div>
                            </div>
                            <button class="exit-btn leave-btn" title="Opuść stół"></button>
                        </div>
                    </div>

                    <div class="board">
                        <div class="turnbar">
                            <span class="roundnumber">Runda 1</span>
                            <span class="turninfo">—</span>
                            <span class="lastmove"></span>
                            <span class="historyinfo"></span>
                        </div>

                        <div class="row siege"  data-pos="top" data-row="siege">
                            <div class="rowscore">0</div>
                            <div class="hornslot"></div>
                            <div class="rowcards"></div>
                        </div>
                        <div class="row ranged" data-pos="top" data-row="ranged">
                            <div class="rowscore">0</div>
                            <div class="hornslot"></div>
                            <div class="rowcards"></div>
                        </div>
                        <div class="row melee"  data-pos="top" data-row="melee">
                            <div class="rowscore">0</div>
                            <div class="hornslot"></div>
                            <div class="rowcards"></div>
                        </div>

                        <div class="midline"></div>

                        <div class="row melee"  data-pos="bottom" data-row="melee">
                            <div class="rowscore">0</div>
                            <div class="hornslot"></div>
                            <div class="rowcards"></div>
                        </div>
                        <div class="row ranged" data-pos="bottom" data-row="ranged">
                            <div class="rowscore">0</div>
                            <div class="hornslot"></div>
                            <div class="rowcards"></div>
                        </div>
                        <div class="row siege"  data-pos="bottom" data-row="siege">
                            <div class="rowscore">0</div>
                            <div class="hornslot"></div>
                            <div class="rowcards"></div>
                        </div>
                    </div>

                    <div class="sidecol sidecol-top">
                        <div class="pilegroup">
                            <div class="pile grave-top">
                                <div class="pileslot"></div>
                                <div class="pilecount">0</div>
                            </div>
                            <div class="pile deck-top">
                                <div class="pileslot"></div>
                                <div class="pilecount">0</div>
                            </div>
                        </div>
                    </div>

                    <div class="leaderbox leader-bottom"></div>

                    <div class="hand game-hand"></div>

                    <div class="sidecol sidecol-bottom">
                        <div class="pilegroup">
                            <div class="pile grave-bottom">
                                <div class="pileslot"></div>
                                <div class="pilecount">0</div>
                            </div>
                            <div class="pile deck-bottom">
                                <div class="pileslot"></div>
                                <div class="pilecount">0</div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="prompt hidden"></div>
                <div class="noteshower game-note"></div>

            </div>

            <!-- ============ PANEL DEBUGOWY ============ -->
            <div class="logpanel">
                <button class="log-toggle">Dziennik zdarzeń</button>
            </div>

        </div>
    </section>
    <footer>
        <div class="footer">
            <a target="_blank" href="./rules.html">Zasady gry</a> | 
            &copy; 2025 - <a target="_blank" style="color: white; text-decoration: none"
                             href="https://github.com/majchjan">
            GitHub/majchjan</a>
        </div>
    </footer>
</body>
</html>
