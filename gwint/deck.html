<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWINT - Edytor talii</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/deck.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/main/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/main/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/main/icon/favicon-16x16.png">
    <link rel="manifest" href="/main/icon/site.webmanifest">
    <script type="module" src="js/deckbuilder.js"></script>
</head>
<body>
    <header class="logo">
        <a href=".">GWINT - Talie</a>
    </header>
    <section>
        <div class="stage deckstage">

            <div class="deckheader">
                <label>Zapisane talie:</label>
                <select class="deck-select span2"></select>
                <button class="new-btn">Nowa talia</button>
                <button class="nextbutton delete-btn">Usuń</button>

                <label>Nazwa:</label>
                <input type="text" class="name-input span2" maxlength="60" placeholder="Nazwa talii">
                <button class="start-btn save-btn span2">Zapisz talię</button>

                <button class="back-btn span5">Wróć do gry</button>
            </div>

            <div class="deckgrid">
                <div class="colheading pool-head">Kolekcja kart</div>
                <div class="factionswitch">
                    <button class="faction-prev" title="Poprzednia frakcja">&lt;</button>
                    <div class="factionname">—</div>
                    <button class="faction-next" title="Następna frakcja">&gt;</button>
                </div>
                <div class="colheading deck-head">Karty w talii</div>

                <div class="filtername pool-filtername">Wszystkie karty</div>
                <div class="factionpassive"></div>
                <div class="filtername deck-filtername">Wszystkie karty</div>

                <div class="filterbar pool-filters"></div>
                <div class="iorow">
                    <button class="export-btn">Eksportuj talię</button>
                    <button class="import-btn">Wczytaj talię</button>
                    <input type="file" class="import-input" accept="application/json,.json" hidden>
                </div>
                <div class="filterbar deck-filters"></div>

                <div class="cardpanel pool-panel">
                    <div class="cardgrid pool-grid"></div>
                </div>

                <div class="deckcenter">
                    <div class="statlabel">Dowódca</div>
                    <div class="leaderslot"></div>
                    <div class="statlabel">Wszystkie karty w talii</div>
                    <div class="statvalue stat-total">0</div>
                    <div class="statlabel">Karty specjalne</div>
                    <div class="statvalue stat-specials">0 / 10</div>
                    <div class="statlabel">Całkowita siła jednostek</div>
                    <div class="statvalue stat-strength">0</div>
                    <div class="statlabel">Karty bohaterów</div>
                    <div class="statvalue stat-heroes">0</div>
                </div>

                <div class="cardpanel deck-panel">
                    <div class="cardgrid deck-grid"></div>
                </div>
            </div>

            <div class="noteshower builder-note"></div>

        </div>
    </section>
    <footer>
        <div class="footer">
            <a href="./index.html">Wróć do gry</a> | 
            &copy; 2025 - <a target="_blank" style="color: white; text-decoration: none"
                             href="https://github.com/majchjan">
            GitHub/majchjan</a>
        </div>
    </footer>
</body>
</html>
